name: Contract CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify and build
        run: ./gradlew :contract:spotlessCheck :contract:clean :contract:build :contract:shadowJar --no-daemon

      - name: Verify fat JAR exists
        run: |
          find contract/build/libs -maxdepth 1 -name '*-all.jar' -print -quit | grep -q .
